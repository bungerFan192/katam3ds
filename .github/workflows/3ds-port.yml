name: 3DS port build
on:
  push:
    branches: [3ds-port-foundation, master]
    paths: ['port/3ds/**', '.github/workflows/3ds-port.yml']
  pull_request:
    paths: ['port/3ds/**', '.github/workflows/3ds-port.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify devkitPro 3DS SDK
        shell: bash
        run: |
          echo "DEVKITPRO=${DEVKITPRO}"
          echo "DEVKITARM=${DEVKITARM}"
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
          test -f "$DEVKITPRO/libctru/include/3ds.h"
          test -f "$DEVKITPRO/libctru/lib/libctru.a"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version
      - name: Build 3DS smoke-test target
        run: make -C port/3ds -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: katam3ds-port-smoke-test
          path: port/3ds/katam3ds-port.3dsx
