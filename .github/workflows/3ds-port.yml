name: 3DS port build
on:
  push:
    branches: [3ds-port-foundation, master]
    paths: ['port/3ds/**', '.github/workflows/3ds-port.yml']
  pull_request:
    paths: ['port/3ds/**', '.github/workflows/3ds-port.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Configure devkitARM environment
        shell: bash
        run: |
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="${DEVKITARM:-$DEVKITPRO/devkitARM}"
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version
      - name: Build 3DS smoke-test target
        run: |
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="${DEVKITARM:-$DEVKITPRO/devkitARM}"
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make -C port/3ds -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: katam3ds-port-smoke-test
          path: port/3ds/katam3ds-port.3dsx
